# Vsako jutro pobere akcije z javnih strani trgovin in jih shrani na vejo "akcije" (datoteka deals.json).
# Veja se vsakič prepiše, da zgodovina ne raste. Trgovina, ki ne uspe, obdrži včerajšnje akcije,
# zagon pa se na koncu označi kot neuspešen (GitHub pošlje e-pošto).
# Zgodovina cen gre na vejo »cene« (dnevni posnetki, z zgodovino) in iz nje stats.json. Aplikacija bere:
# https://raw.githubusercontent.com/jakobboro-wq/stroski/akcije/deals.json
name: Akcije

on:
  schedule:
    - cron: '15 4 * * *' # 5.15 pozimi, 6.15 poleti
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: akcije
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testi
        run: node --test
      - name: Včerajšnje akcije
        run: |
          mkdir -p data
          git fetch -q --depth=1 origin akcije && git show FETCH_HEAD:deals.json > data/prev.json || echo "Veje akcije še ni."
      - name: Poberi akcije
        run: node scraper/deals.mjs
      - name: Zgodovina cen (veja cene)
        id: cene
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin cene >/dev/null; then
            git clone -q --depth 1 --branch cene "$URL" cene
          else
            mkdir cene && git -C cene init -q -b cene && git -C cene remote add origin "$URL"
          fi
          node scraper/history.mjs cene data/deals.json
          cd cene
          git config user.name "akcije-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cene $(date -u +%F)" || echo "Ni sprememb."
          git push -q origin cene
      - name: Obvestila o akcijah
        # Izdelki z zvoncem (Supabase) proti današnjim akcijam; brez ključev se preskoči. Dnevnik izpiše samo števila.
        continue-on-error: true
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scraper/alerts.mjs data/deals.json
      - name: Shrani na vejo akcije
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp data/deals.json out/
          cd out
          git init -q -b akcije
          git config user.name "akcije-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -q -m "Akcije $(date -u +%F)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" akcije
      - name: Preveri zgodovino cen
        if: steps.cene.outcome == 'failure'
        run: |
          echo "::error::Zgodovina cen se danes ni posodobila (akcije so vseeno objavljene)."
          exit 1
      - name: Preveri, ali so uspele vse trgovine
        run: |
          node -e "
            const { stores } = JSON.parse(require('fs').readFileSync('data/deals.json', 'utf8'));
            const bad = Object.entries(stores).filter(([, s]) => !s.ok);
            for (const [id, s] of bad) console.log('::error::' + id + ': ' + s.error);
            process.exit(bad.length ? 1 : 0);
          "
